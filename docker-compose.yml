services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: himid
      POSTGRES_USER: himid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-himid}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"  # local access only (psql, seed from host)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U himid -d himid"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    # Dashboard only: the daily report is run by cron, see README
    command: uv run streamlit run src/app.py --server.port=8501 --server.address=0.0.0.0
    env_file: .env
    environment:
      DATABASE_URL: postgresql://himid:${POSTGRES_PASSWORD:-himid}@db:5432/himid
    ports:
      - "8501:8501"
    volumes:
      - ./assets:/app/assets
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
